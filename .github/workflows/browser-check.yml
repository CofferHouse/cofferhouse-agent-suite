name: Holder Center browser acceptance

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/check-browser.mjs"
      - "package*.json"
      - ".github/workflows/browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_QA_ARTIFACT_DIR: browser-artifacts
