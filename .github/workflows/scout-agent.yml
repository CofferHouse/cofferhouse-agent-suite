name: Scout Agent Cycle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-agent-cycle
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke the protected Scout runtime
        env:
          SCOUT_AGENT_URL: ${{ secrets.SCOUT_AGENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SCOUT_AGENT_URL" || { echo "SCOUT_AGENT_URL is not configured"; exit 1; }
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is not configured"; exit 1; }
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SCOUT_AGENT_URL%/}/api/agent/run"
