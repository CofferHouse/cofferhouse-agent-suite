name: Check agent suite
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, guardian/individual-loan-alerts-2026-10-20]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
